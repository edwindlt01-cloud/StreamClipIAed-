
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamClipIAed</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#100d20;color:white;
  font-family:Arial,sans-serif;padding:20px
}
.container{max-width:500px;margin:auto}
h1{text-align:center;color:#b99aff}
p{color:#c9c3d8;line-height:1.5}
.card{
  background:#201a35;padding:18px;
  border-radius:16px;margin:16px 0
}
input,button{
  width:100%;padding:13px;margin:8px 0;
  border-radius:9px;border:0;font-size:16px
}
input{background:#fff;color:#222}
button{
  background:#8855ed;color:white;
  font-weight:bold;cursor:pointer
}
button:disabled{opacity:.45}
video{width:100%;border-radius:12px;background:#000}
.row{display:flex;gap:10px}
.row>div{flex:1;min-width:0}
.row input{width:100%}
#status{color:#b99aff;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h1>🎬 StreamClipIAed</h1>
<p style="text-align:center">Tu creador de clips para TikTok</p>

<div class="card">
  <h3>1. Selecciona tu video</h3>
  <input type="file" id="file" accept="video/*">
  <video id="video" controls playsinline></video>
</div>

<div class="card">
  <h3>2. Selecciona el fragmento</h3>
  <div class="row">
    <div>
      <label>Inicio (segundos)</label>
      <input id="start" type="number" min="0" value="0">
    </div>
    <div>
      <label>Final (segundos)</label>
      <input id="end" type="number" min="1" value="30">
    </div>
  </div>
  <button id="preview">Ver fragmento</button>
</div>

<div class="card">
  <h3>3. Exportar clip vertical</h3>
  <p>Formato 9:16 · 720 × 1280 · WebM</p>
  <button id="export" disabled>✂️ Crear mi clip</button>
  <p id="status">Selecciona un video para comenzar.</p>
  <a id="download" style="display:none;color:#b99aff"
     download="streamclip.webm">Descargar mi clip</a>
</div>
</div>

<script>
const file = document.getElementById('file');
const video = document.getElementById('video');
const start = document.getElementById('start');
const end = document.getElementById('end');
const preview = document.getElementById('preview');
const exportBtn = document.getElementById('export');
const status = document.getElementById('status');
const download = document.getElementById('download');

let videoURL = null;
let busy = false;

file.addEventListener('change', () => {
  const selected = file.files[0];
  if (!selected) return;

  if (videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(selected);
  video.src = videoURL;
  download.style.display = 'none';
  exportBtn.disabled = true;
  status.textContent = 'Cargando video...';
});

video.addEventListener('loadedmetadata', () => {
  start.value = 0;
  end.value = Math.floor(video.duration);
  exportBtn.disabled = false;
  status.textContent =
    'Video listo. Duración: ' +
    Math.floor(video.duration) + ' segundos.';
});

preview.addEventListener('click', async () => {
  const a = Number(start.value);
  const b = Number(end.value);

  if (!video.src || a < 0 || b <= a || b > video.duration) {
    alert('Revisa el inicio y el final del clip.');
    return;
  }

  video.currentTime = a;
  video.controls = true;
  await video.play();
  status.textContent = 'Reproduciendo fragmento...';

  const stopPreview = () => {
    if (video.currentTime >= b) {
      video.pause();
      video.removeEventListener('timeupdate', stopPreview);
      status.textContent = 'Vista previa terminada.';
    }
  };

  video.addEventListener('timeupdate', stopPreview);
});

exportBtn.addEventListener('click', async () => {
  if (busy) return;

  const a = Number(start.value);
  const b = Number(end.value);

  if (!video.src || a < 0 || b <= a || b > video.duration) {
    alert('Selecciona un intervalo válido.');
    return;
  }

  if (!video.captureStream && !video.mozCaptureStream) {
    alert('Tu navegador no permite capturar el audio del video.');
    return;
  }

  const capture = video.captureStream
    ? video.captureStream.bind(video)
    : video.mozCaptureStream.bind(video);

  if (!window.MediaRecorder ||
      !HTMLCanvasElement.prototype.captureStream) {
    alert('Tu navegador no admite esta función de exportación.');
    return;
  }

  busy = true;
  exportBtn.disabled = true;
  download.style.display = 'none';

  const canvas = document.createElement('canvas');
  canvas.width = 720;
  canvas.height = 1280;

  const ctx = canvas.getContext('2d');
  const canvasStream = canvas.captureStream(30);
  let sourceStream;

  try {
    video.pause();
    video.currentTime = a;

    await new Promise((resolve, reject) => {
      const ready = () => {
        video.removeEventListener('seeked', ready);
        resolve();
      };
      video.addEventListener('seeked', ready, {once:true});
      video.addEventListener('error', reject, {once:true});
    });

    sourceStream = capture();

    const audioTracks = sourceStream.getAudioTracks();
    const tracks = [
      ...canvasStream.getVideoTracks(),
      ...audioTracks
    ];

    const outputStream = new MediaStream(tracks);

    const mime = [
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ].find(type => MediaRecorder.isTypeSupported(type));

    if (!mime) throw new Error('Formato WebM no disponible.');

    const recorder = new MediaRecorder(outputStream, {
      mimeType:mime
    });

    const chunks = [];

    recorder.ondataavailable = e => {
      if (e.data.size) chunks.push(e.data);
    };

    const finished = new Promise(resolve => {
      recorder.onstop = resolve;
    });

    function drawFrame() {
      if (!busy) return;

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (vw && vh) {
        const scale = Math.max(720 / vw, 1280 / vh);
        const sw = 720 / scale;
        const sh = 1280 / scale;
        const sx = (vw - sw) / 2;
        const sy = (vh - sh) / 2;

        ctx.drawImage(
          video, sx, sy, sw, sh,
          0, 0, 720, 1280
        );
      }

      if (video.currentTime >= b || video.ended) {
        if (recorder.state === 'recording') recorder.stop();
        video.pause();
        return;
      }

      requestAnimationFrame(drawFrame);
    }

    video.muted = false;
    recorder.start(500);
    await video.play();

    status.textContent = 'Creando clip...';

    drawFrame();

    await finished;

    const blob = new Blob(chunks, {type:'video/webm'});
    const url = URL.createObjectURL(blob);

    download.href = url;
    download.style.display = 'block';
    download.textContent = '⬇ Descargar clip';
    status.textContent = '¡Clip terminado!';

  } catch (error) {
    status.textContent = 'Error: ' + error.message;
  } finally {
    busy = false;
    exportBtn.disabled = false;
    video.pause();

    if (sourceStream) {
      sourceStream.getTracks().forEach(t => t.stop());
    }
    canvasStream.getTracks().forEach(t => t.stop());
  }
});
</script>
</body>
</html>
